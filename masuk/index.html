<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4B3A86">
    <title>Masuk · Financial Daily Report</title>
    <link rel="icon" type="image/png" href="/app/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script>
        // Dicatat sebelum pustaka Supabase membaca lalu membersihkan alamat
        window.FD_IS_RECOVERY = /type=recovery/.test(location.hash);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
            integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
            crossorigin="anonymous"></script>
    <script src="/fd-auth.js"></script>
    <style>
        :root {
            --ink: #FFFFFF; --ink-2: rgba(255,255,255,.82); --ink-3: rgba(255,255,255,.66);
            --accent: #7C3AED; --accent-strong: #6D28D9; --accent-light: #C4B5FD;
            --glass: rgba(255,255,255,.12); --glass-2: rgba(255,255,255,.10);
            --stroke: rgba(255,255,255,.55); --field: rgba(255,255,255,.70);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            font-family: 'Inter', system-ui, sans-serif; color: var(--ink); line-height: 1.5;
            min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
            -webkit-font-smoothing: antialiased;
            background-color: #3B2A63;
            background-image: linear-gradient(180deg, rgba(24,12,48,.30), rgba(24,12,48,.45)), url('/masuk/img/login-bg-desktop.webp');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        @media (max-width: 700px), (orientation: portrait) {
            body { background-image: linear-gradient(180deg, rgba(24,12,48,.25), rgba(24,12,48,.45)), url('/masuk/img/login-bg-mobile.webp'); background-attachment: scroll; }
        }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; text-shadow: 0 1px 12px rgba(20,8,48,.35); }
        .brand-logo {
            width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center;
            background: #fff; color: var(--accent);
            font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 16px;
            box-shadow: 0 4px 16px rgba(20,8,48,.25);
        }
        .brand-name { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 19px; color: #fff; letter-spacing: -0.01em; }
        .card {
            width: 100%; max-width: 420px; padding: 30px 26px; border-radius: 20px;
            background: var(--glass); border: 1px solid var(--stroke);
            -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
            box-shadow: 0 18px 50px rgba(20,8,48,.35), 0 10px 34px rgba(167,139,250,.55);
        }
        h1 { margin: 0 0 4px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; color: #fff; letter-spacing: -0.01em; text-align: center; }
        .sub { margin: 0 0 24px; color: var(--ink-2); font-size: 14px; text-align: center; }
        label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 7px; color: #fff; }
        .field { margin-bottom: 16px; }
        input {
            width: 100%; min-height: 48px; padding: 0 18px; border-radius: 999px; font: inherit; font-size: 16px;
            background: var(--glass-2); border: 1.5px solid var(--field); color: #fff;
            transition: border-color .15s, box-shadow .15s, background .15s;
        }
        input::placeholder { color: var(--ink-3); }
        input:focus { outline: none; border-color: #fff; background: rgba(255,255,255,.16); box-shadow: 0 0 0 4px rgba(196,181,253,.45); }
        input:-webkit-autofill { -webkit-text-fill-color: #fff; -webkit-box-shadow: 0 0 0 40px rgba(91,63,160,.92) inset; caret-color: #fff; }
        .pass-wrap { position: relative; }
        .pass-wrap input { padding-right: 54px; }
        .eye {
            position: absolute; right: 4px; top: 4px; width: 44px; height: 40px; border: none; border-radius: 999px;
            background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center;
        }
        .eye:hover { color: #fff; background: rgba(255,255,255,.12); } .eye svg { width: 20px; height: 20px; }
        .btn {
            width: 100%; min-height: 50px; margin-top: 6px; border: none; border-radius: 12px; cursor: pointer; font: inherit;
            font-weight: 700; font-size: 16px; background: var(--accent); color: #fff; transition: background .15s, box-shadow .15s;
            box-shadow: 0 8px 22px rgba(124,58,237,.45);
        }
        .btn:hover { background: var(--accent-strong); }
        .btn[disabled] { opacity: .65; cursor: progress; }
        .link {
            display: inline-flex; align-items: center; min-height: 44px; margin-top: 8px; background: none; border: none; padding: 0; cursor: pointer;
            color: #fff; font: inherit; font-size: 14px; font-weight: 600; text-decoration: underline; text-decoration-color: rgba(255,255,255,.45); text-underline-offset: 3px;
        }
        .link:hover { text-decoration-color: #fff; }
        #panelLogin .link, #panelReset .link { display: flex; justify-content: center; width: 100%; }
        :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        .msg { display: none; margin: 0 0 18px; padding: 12px 14px; border-radius: 12px; font-size: 14px; color: #fff; }
        .msg.show { display: block; }
        .msg.err { background: rgba(180,35,24,.55); border: 1px solid rgba(253,162,155,.7); }
        .msg.ok { background: rgba(6,118,71,.55); border: 1px solid rgba(108,233,166,.7); }
        .msg.info { background: rgba(23,92,211,.50); border: 1px solid rgba(132,202,255,.7); }
        .foot { margin-top: 18px; font-size: 13px; color: var(--ink-2); text-align: center; max-width: 420px; text-shadow: 0 1px 10px rgba(20,8,48,.45); }
        [hidden] { display: none !important; }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .card { background: rgba(58,36,110,.82); }
        }
    </style>
</head>
<body>
    <div class="brand"><div class="brand-logo" aria-hidden="true">FD</div><div class="brand-name">Financial Daily Report</div></div>

    <main class="card">
        <div id="msg" class="msg" role="alert" aria-live="polite"></div>

        <!-- Masuk -->
        <section id="panelLogin">
            <h1>Masuk</h1>
            <p class="sub">Pakai akun yang terdaftar di instansimu.</p>
            <form id="formLogin" novalidate>
                <div class="field">
                    <label for="loginId">Email atau nama pengguna</label>
                    <input id="loginId" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
                </div>
                <div class="field">
                    <label for="loginPass">Password</label>
                    <div class="pass-wrap">
                        <input id="loginPass" type="password" autocomplete="current-password" required>
                        <button type="button" class="eye" data-target="loginPass" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                </div>
                <button type="submit" class="btn" id="btnLogin">Masuk</button>
            </form>
            <button type="button" class="link" id="toReset">Lupa password?</button>
        </section>

        <!-- Lupa password -->
        <section id="panelReset" hidden>
            <h1>Atur ulang password</h1>
            <p class="sub">Masukkan email akunmu. Kami kirim tautan untuk membuat password baru.</p>
            <form id="formReset" novalidate>
                <div class="field">
                    <label for="resetEmail">Email</label>
                    <input id="resetEmail" type="email" autocomplete="email" autocapitalize="none" required>
                </div>
                <button type="submit" class="btn" id="btnReset">Kirim tautan</button>
            </form>
            <button type="button" class="link" id="backToLogin">Kembali ke halaman masuk</button>
        </section>

        <!-- Password baru (setelah membuka tautan dari email) -->
        <section id="panelNewPass" hidden>
            <h1>Buat password baru</h1>
            <p class="sub">Minimal 8 karakter. Setelah disimpan, kamu langsung masuk.</p>
            <form id="formNewPass" novalidate>
                <div class="field">
                    <label for="newPass">Password baru</label>
                    <div class="pass-wrap">
                        <input id="newPass" type="password" autocomplete="new-password" minlength="8" required>
                        <button type="button" class="eye" data-target="newPass" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                </div>
                <div class="field">
                    <label for="newPass2">Ulangi password baru</label>
                    <input id="newPass2" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" class="btn" id="btnNewPass">Simpan password</button>
            </form>
        </section>
    </main>

    <p class="foot">Akun pemantau dibuat oleh admin instansimu.</p>

    <script>
    (function () {
        'use strict';
        var $ = function (id) { return document.getElementById(id); };
        var msgEl = $('msg');

        function show(text, kind) { msgEl.textContent = text; msgEl.className = 'msg show ' + (kind || 'err'); }
        function clearMsg() { msgEl.className = 'msg'; msgEl.textContent = ''; }
        function panel(name) {
            ['panelLogin', 'panelReset', 'panelNewPass'].forEach(function (p) { $(p).hidden = (p !== name); });
            clearMsg();
        }
        function busy(btn, on, label) { btn.disabled = on; btn.textContent = label; }

        if (!window.FD) { show('Aplikasi gagal memuat sambungan ke server. Periksa internet, lalu muat ulang halaman ini.'); return; }

        // Tombol tampilkan/sembunyikan password
        document.querySelectorAll('.eye').forEach(function (b) {
            b.addEventListener('click', function () {
                var inp = $(b.dataset.target), shown = inp.type === 'text';
                inp.type = shown ? 'password' : 'text';
                b.setAttribute('aria-label', shown ? 'Tampilkan password' : 'Sembunyikan password');
            });
        });

        // Pesan dari halaman aplikasi (misalnya akses dicabut)
        var reason = sessionStorage.getItem('fd_logout_reason');
        if (reason) { sessionStorage.removeItem('fd_logout_reason'); show(reason, 'info'); }

        async function goToApp(user) {
            var member = await FD.fetchMember(user);
            if (!member) {
                await (await FD.ready).auth.signOut({ scope: 'local' });
                FD.saveMember(null);
                show('Akun ini belum terhubung ke instansi mana pun. Hubungi admin instansimu.');
                return false;
            }
            FD.saveMember(member);
            FD.go(FD.APP_URL);
            return true;
        }

        // Datang dari tautan reset password di email
        FD.ready.then(function (sb) {
            sb.auth.onAuthStateChange(function (event) {
                if (event === 'PASSWORD_RECOVERY') panel('panelNewPass');
            });
        });

        // Sudah login sebelumnya? Langsung ke aplikasi
        (async function () {
            if (window.FD_IS_RECOVERY) { panel('panelNewPass'); return; }
            var s = await (await FD.ready).auth.getSession();
            var session = s && s.data && s.data.session;
            if (!session) return;
            if (!navigator.onLine) {
                var cached = FD.readMember();
                if (cached && cached.user_id === session.user.id) FD.go(FD.APP_URL);
                return;
            }
            try { await goToApp(session.user); } catch (e) { /* biarkan di halaman masuk */ }
        })();

        // ---- Masuk ----
        $('formLogin').addEventListener('submit', async function (e) {
            e.preventDefault();
            clearMsg();
            var id = $('loginId').value.trim(), pass = $('loginPass').value;
            if (!id || !pass) { show('Isi email atau nama pengguna, dan password.'); return; }
            var email = FD.loginEmail(id);
            if (!email) { show('Nama pengguna hanya boleh huruf kecil, angka, titik, garis bawah, atau strip (3 sampai 30 karakter).'); return; }
            if (!navigator.onLine) { show('Tidak ada koneksi internet. Masuk pertama kali butuh internet.'); return; }
            var btn = $('btnLogin');
            busy(btn, true, 'Memeriksa...');
            try {
                var res = await (await FD.ready).auth.signInWithPassword({ email: email, password: pass });
                if (res.error) { show(FD.friendlyError(res.error)); return; }
                await goToApp(res.data.user);
            } catch (err) {
                show(FD.friendlyError(err));
            } finally {
                busy(btn, false, 'Masuk');
            }
        });

        // ---- Lupa password ----
        $('toReset').addEventListener('click', function () {
            panel('panelReset');
            var id = $('loginId').value.trim();
            if (id.indexOf('@') !== -1) $('resetEmail').value = id;
            $('resetEmail').focus();
        });
        $('backToLogin').addEventListener('click', function () { panel('panelLogin'); $('loginId').focus(); });

        $('formReset').addEventListener('submit', async function (e) {
            e.preventDefault();
            clearMsg();
            var email = $('resetEmail').value.trim();
            if (email.indexOf('@') === -1) { show('Isi alamat email akunmu.'); return; }
            if (!navigator.onLine) { show('Tidak ada koneksi internet.'); return; }
            var btn = $('btnReset');
            busy(btn, true, 'Mengirim...');
            try {
                var res = await (await FD.ready).auth.resetPasswordForEmail(email, { redirectTo: location.origin + FD.LOGIN_URL });
                if (res.error) { show(FD.friendlyError(res.error)); return; }
                show('Kalau email itu terdaftar, tautan sudah dikirim. Cek kotak masuk dan folder spam.', 'ok');
            } catch (err) {
                show(FD.friendlyError(err));
            } finally {
                busy(btn, false, 'Kirim tautan');
            }
        });

        // ---- Password baru ----
        $('formNewPass').addEventListener('submit', async function (e) {
            e.preventDefault();
            clearMsg();
            var p1 = $('newPass').value, p2 = $('newPass2').value;
            if (p1.length < 8) { show('Password minimal 8 karakter.'); return; }
            if (p1 !== p2) { show('Kedua password tidak sama.'); return; }
            var btn = $('btnNewPass');
            busy(btn, true, 'Menyimpan...');
            try {
                var res = await (await FD.ready).auth.updateUser({ password: p1 });
                if (res.error) { show(FD.friendlyError(res.error)); return; }
                show('Password baru tersimpan.', 'ok');
                await goToApp(res.data.user);
            } catch (err) {
                show(FD.friendlyError(err));
            } finally {
                busy(btn, false, 'Simpan password');
            }
        });
    })();
    </script>
</body>
</html>
